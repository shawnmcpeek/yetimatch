name: yetimatch
description: YetiMatch - personality quiz app (Flutter).
publish_to: 'none'
version: 1.1.9+9

environment:
  sdk: ^3.11.1
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  # Firebase (FlutterFire BoM 5.x)
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  # RevenueCat
  purchases_flutter: ^10.18.1
  purchases_ui_flutter: ^10.18.1
  # Local storage & networking
  shared_preferences: ^2.3.3
  http: ^1.2.2
  # URL launcher for privacy/support links
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  meta: ^1.18.1

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/yetimatch.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/yetimatch.png
  min_sdk_android: 24
